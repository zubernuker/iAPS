name: Build check (unsigned)

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: xcodebuild without signing
    runs-on: xcode-27
    timeout-minutes: 190

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Select latest stable Xcode 27
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -viE 'beta|Release_Candidate' | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then
            sudo xcode-select --switch "$XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Dummy Team ID (via ConfigOverride)
        run: printf 'DEVELOPER_TEAM = ABCDE12345\n' > ConfigOverride.xcconfig

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: spm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Show deployment targets
        run: grep -o 'IPHONEOS_DEPLOYMENT_TARGET = [^;]*' FreeAPS.xcodeproj/project.pbxproj | sort | uniq -c
        
      - name: Build (signing disabled)
        run: |
          set -o pipefail
          command -v xcbeautify >/dev/null || brew install xcbeautify
          xcodebuild build \
            -workspace FreeAPS.xcworkspace \
            -scheme FreeAPSWorkspace \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath dd \
            -clonedSourcePackagesDirPath spm \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_STYLE=Manual \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee xcodebuild.log | xcbeautify

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7